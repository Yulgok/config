{
  "node.id": "my-web-db-canary",

  "http.enabled": true,
  "http.port": 80,
  "http.banner": "Apache/2.4.41 (Ubuntu)",
  "http.skin": "nasLogin",

  "https.enabled": true,
  "https.port": 443,
  "https.banner": "Apache/2.4.41 (Ubuntu)",
  "https.skin": "nasLogin",
  "https.certificate": "/etc/ssl/opencanary/opencanary.pem",
  "https.key": "/etc/ssl/opencanary/opencanary.key",

  "mysql.enabled": true,
  "mysql.port": 3306,
  "mysql.banner": "5.5.43-0ubuntu0.14.04.1",
  "mysql.log_connection_made": true,

  "logger.class": "opencanary.logger.PyLogger",
  "logger.kwargs": {
    "format": "%(asctime)s %(message)s"
  }
}